<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>あつ森 通常住民 TOP100 ソート v6</title>
<style>
:root{--ink:#37443d;--muted:#78817c;--line:#d8d4c7;--green:#6ca477;--gold:#ddb15b}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(#edf7ef,#f7f3e8 30%);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
main{max-width:900px;margin:auto;padding:16px 10px 60px}
h1{text-align:center;font-size:clamp(24px,5vw,38px);margin:10px 0 4px}
.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:14px}
.panel{background:#fffdf7;border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 8px 24px rgba(50,65,55,.09)}
#diag{font-size:12px;line-height:1.7;padding:10px 11px;margin-bottom:10px;border-radius:11px;background:#fff6da;border:1px solid #ead39b}
#diag.ok{background:#edf7ee;border-color:#b8d7bf}
#diag.bad{background:#fbe9e7;border-color:#e2b0ac}
.compare{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px}
.vs{display:grid;place-items:center;font-weight:900;color:#999}
.card{appearance:none;border:2px solid transparent;background:#fff;border-radius:20px;min-height:320px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.06);font:inherit;color:var(--ink)}
.card img{width:min(225px,92%);height:225px;object-fit:contain}
.name{font-size:23px;font-weight:850;margin-top:7px}.eng{font-size:11px;color:var(--muted)}
.status{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:11px}
.bar{height:10px;background:#e6e2d8;border-radius:99px;overflow:hidden}.bar>div{width:0;height:100%;background:linear-gradient(90deg,var(--green),var(--gold))}
#statusText{font-size:12px;color:var(--muted)}
.hint{text-align:center;font-size:12px;color:var(--muted);line-height:1.7;margin-top:11px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ctrl{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:#e8ece8;color:var(--ink)}.ctrl.primary{background:var(--green);color:white}.ctrl.danger{background:#f0d4d1;color:#793d38}.ctrl:disabled{opacity:.45}
#results{display:none}.resultrow{display:grid;grid-template-columns:48px 66px 1fr;gap:10px;align-items:center;background:white;border:1px solid var(--line);border-radius:14px;padding:7px 10px;margin:7px 0}.resultrow img{width:62px;height:62px;object-fit:contain}.rank{font-size:18px;font-weight:900;text-align:center}.rname{font-weight:850}.ren{font-size:11px;color:var(--muted)}
@media(max-width:620px){.compare{grid-template-columns:1fr 28px 1fr;gap:4px}.card{min-height:245px}.card img{height:168px;width:96%}.name{font-size:19px}}
</style>
</head>
<body>
<main>
<h1>🌿 あつ森 通常住民 TOP100 ソート</h1>
<div class="sub">通常住民407人／NPC・コラボ除外／実際の住民アイコン</div>
<section class="panel">

<div id="diag">HTML：OK ／ JavaScript：起動確認中 ／ 住民データ：未読込</div>

<div id="sorter">
<div class="status"><div class="bar"><div id="bar"></div></div><div id="statusText">起動中</div></div>
<div class="compare">
<button class="card" id="left" type="button">
<img id="leftImg" src="https://acnhcdn.com/latest/NpcIcon/cat10.png" alt="1ごう">
<div class="name" id="leftName">1ごう</div><div class="eng" id="leftEng">Kid Cat</div>
</button>
<div class="vs">VS</div>
<button class="card" id="right" type="button">
<img id="rightImg" src="https://acnhcdn.com/latest/NpcIcon/squ05.png" alt="2ごう">
<div class="name" id="rightName">2ごう</div><div class="eng" id="rightEng">Agent S</div>
</button>
</div>
<div class="hint" id="hint">最初の2人が見えていればHTMLと画像表示は正常です。住民データを読み込んでいます。</div>
<div class="controls"><button class="ctrl" id="undo" disabled>↶ 1つ戻す</button><button class="ctrl danger" id="restart">最初から</button></div>
</div>

<div id="results">
<h2>あなたのTOP100</h2><div id="meta" class="sub" style="text-align:left"></div>
<div class="controls" style="justify-content:flex-start"><button class="ctrl primary" id="copy">TOP100をコピー</button><button class="ctrl" id="redo">もう一度</button></div>
<div id="ranking"></div>
</div>

</section>
</main>

<script>
(function(){
"use strict";
var diag=document.getElementById("diag");
diag.textContent="HTML：OK ／ JavaScript：OK ／ 住民データ：読み込み中";
diag.className="ok";

var V=[], map=new Map(), LIMIT=100, KEY="acnh-top100-v6", state=null, undoSnapshot=null;
var SANRIO=new Set(["Rilla","Marty","Etoile","Chai","Chelsea","Toby"]);
var loaded=false;

window.__ACNH_DATA_READY__=function(raw){
  try{
    var arr=raw && raw.villagers ? raw.villagers : raw;
    if(!Array.isArray(arr)) throw new Error("villagers配列を取得できません");
    V=arr.filter(function(v){return !SANRIO.has(v.name)}).map(function(v){
      return {id:v.filename,name:v.name,jp:(v.translations&&v.translations.jPja)||v.name,img:v.iconImage};
    });
    if(V.length!==407) throw new Error("対象数 "+V.length+"人（407人ではありません）");
    map=new Map(V.map(function(v){return [v.id,v]}));
    loaded=true;
    diag.textContent="HTML：OK ／ JavaScript：OK ／ 住民データ：OK（407人）";
    diag.className="ok";
    startApp();
  }catch(e){fail(e.message)}
};

function fail(msg){
  loaded=true;
  diag.textContent="HTML：OK ／ JavaScript：OK ／ 住民データ：エラー（"+msg+"）";
  diag.className="bad";
  document.getElementById("statusText").textContent="読込失敗";
  document.getElementById("hint").innerHTML=
    "この表示環境では外部モジュールを読み込めません。<br><b>Safari / ChromeでこのHTMLファイルを直接開いてください。</b>";
}

setTimeout(function(){if(!loaded) fail("8秒以内に外部モジュールが応答しませんでした")},8000);

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function fresh(){return{order:shuffle(V.map(function(x){return x.id})),idx:0,top:[],phase:null,candidate:null,low:0,high:0,pivot:null,comparisons:0,finished:false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function restore(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order&&s.order.length===407){state=s;return true}}catch(e){}return false}
function snap(){undoSnapshot=JSON.stringify(state);document.getElementById("undo").disabled=false}
function setCard(side,id){var v=map.get(id);document.getElementById(side+"Img").src=v.img;document.getElementById(side+"Img").alt=v.jp;document.getElementById(side+"Name").textContent=v.jp;document.getElementById(side+"Eng").textContent=v.name}
function pair(a,b){
 var flip=((state.idx+state.comparisons)%2)===1,l=flip?b:a,r=flip?a:b;
 setCard("left",l);setCard("right",r);
 document.getElementById("left").onclick=function(){choose(l)};
 document.getElementById("right").onclick=function(){choose(r)};
 document.getElementById("bar").style.width=Math.round(state.idx/407*100)+"%";
 document.getElementById("statusText").textContent=state.idx+" / 407人・比較 "+state.comparisons+"回";
 document.getElementById("hint").innerHTML="より好きな住民をタップしてください。<br>上位100人だけを確定します。";
 save();
}
function begin(){
 if(state.idx>=407){state.finished=true;save();results();return}
 state.candidate=state.order[state.idx];
 if(state.top.length<LIMIT){state.phase="insert";state.low=0;state.high=state.top.length;if(!state.high){state.top.push(state.candidate);state.idx++;state.candidate=null;begin()}else insert()}
 else{state.phase="threshold";state.pivot=state.top[99];pair(state.candidate,state.pivot)}
}
function insert(){
 if(state.low>=state.high){state.top.splice(state.low,0,state.candidate);if(state.top.length>100)state.top.pop();state.idx++;state.candidate=null;state.phase=null;save();begin();return}
 var mid=Math.floor((state.low+state.high)/2);state.pivot=state.top[mid];pair(state.candidate,state.pivot)
}
function choose(w){snap();state.comparisons++;if(state.phase==="threshold"){if(w===state.candidate){state.phase="insert";state.low=0;state.high=99;insert()}else{state.idx++;state.candidate=null;state.phase=null;save();begin()}}else{var mid=Math.floor((state.low+state.high)/2);if(w===state.candidate)state.high=mid;else state.low=mid+1;insert()}}
function results(){
 document.getElementById("sorter").style.display="none";document.getElementById("results").style.display="block";
 document.getElementById("meta").textContent="通常住民407人から選出・比較 "+state.comparisons+"回";
 var box=document.getElementById("ranking");box.innerHTML="";
 state.top.forEach(function(id,i){var v=map.get(id),row=document.createElement("div");row.className="resultrow";row.innerHTML='<div class="rank">'+(i+1)+'</div><img src="'+v.img+'" alt=""><div><div class="rname"></div><div class="ren"></div></div>';row.querySelector(".rname").textContent=v.jp;row.querySelector(".ren").textContent=v.name;box.appendChild(row)})
}
function reset(){if(!confirm("進行状況を消して最初からやり直しますか？"))return;try{localStorage.removeItem(KEY)}catch(e){}undoSnapshot=null;state=fresh();save();begin()}
function startApp(){if(!restore()){state=fresh();save()}if(state.finished)results();else if(state.candidate){state.phase==="threshold"?pair(state.candidate,state.pivot):insert()}else begin()}
document.getElementById("undo").onclick=function(){if(!undoSnapshot)return;state=JSON.parse(undoSnapshot);undoSnapshot=null;this.disabled=true;save();state.phase==="threshold"?pair(state.candidate,state.pivot):insert()};
document.getElementById("restart").onclick=reset;document.getElementById("redo").onclick=reset;
document.getElementById("copy").onclick=function(){var t=state.top.map(function(id,i){return(i+1)+"位 "+map.get(id).jp}).join("\n");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert("コピーしました")},function(){prompt("コピーしてください",t)})}else prompt("コピーしてください",t)};
})();
</script>

<script type="module">
try{
  const mod = await import("https://esm.sh/animal-crossing@8.2.0?bundle");
  window.__ACNH_DATA_READY__(mod);
}catch(e){
  window.__ACNH_DATA_READY__({error:e});
}
</script>
</body>
</html>
